name: Dynamic Test-Subset Routing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      tests: ${{ steps.routing.outputs.tests }}
      run_all: ${{ steps.routing.outputs.run_all }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@v47

      - name: Route tests dynamically
        id: routing
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          python - <<'PY'
          import os

          files = os.environ.get("CHANGED_FILES", "").split()

          mapping = {
              "src/pricing.py": "test_pricing.py",
              "src/cart.py": "test_cart.py",
              "src/inventory.py": "test_inventory.py",
          }

          selected = set()
          run_all = False

          for file in files:
              if file in mapping:
                  selected.add(mapping[file])
              elif file.startswith("test_") and file.endswith(".py"):
                  selected.add(file)
              else:
                  run_all = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              if run_all or not selected:
                  output.write("tests=all\n")
                  output.write("run_all=true\n")
              else:
                  output.write(
                      f"tests={' '.join(sorted(selected))}\n"
                  )
                  output.write("run_all=false\n")

          print("Changed files:", files)
          print("Selected tests:", selected)
          print("Run all tests:", run_all)
          PY

  run-tests:
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run selected tests
        env:
          RUN_ALL: ${{ needs.detect-changes.outputs.run_all }}
          SELECTED_TESTS: ${{ needs.detect-changes.outputs.tests }}
        run: |
          if [ "$RUN_ALL" = "true" ]; then
            pytest -v
          else
            pytest -v $SELECTED_TESTS
          fi